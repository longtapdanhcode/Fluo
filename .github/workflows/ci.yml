# Cổng chất lượng của constitution: test, typecheck, lint, kiểm tra nội dung và next build.
# Không cần khóa bí mật: build chỉ cần một DATABASE_URL giả vì không trang nào truy vấn DB lúc build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # onnxruntime-node (Kokoro TTS) mặc định tải bản CUDA trên Linux x64 và có thể lỗi 404.
      # CI không sinh âm thanh nên bỏ qua; bản CPU vẫn được cài.
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run content:check
      - run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@127.0.0.1:5432/ci
